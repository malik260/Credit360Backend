<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <link href="Content/bootstrap.min.css" rel="stylesheet" />
</head>

<body style="padding-top:20px;">
    <div class="col-cmd-10 col-cmd-offset-1">
        <div class="well">
            <input type="button" class="btn btn-success" id="btnLoadEmployees" value="Load Employees" />
            <span id="spanUsername" class="text-muted"></span>
            <input type="button" class="btn btn-success pull-right" id="btnLogoff" value="Log Off" />

        </div>
        <div class="well hidden" id="divData">
            <table class="table table-bordered" id="tblData">
                <thead>
                    <tr class="success">
                        <td>Id</td>
                        <td>First Name</td>
                        <td>Last Name</td>
                        <td>Gender</td>
                        <td>Salary</td>
                    </tr>
                </thead>
                <tbody id="tblBody"></tbody>
            </table>
        </div>
        <div class="modal fade" tabindex="-1" id="errorModal"
             data-keyboard="false" data-backdrop="static">
            <div class="modal-dialog modal-sm">
                <div class="modal-content">
                    <div class="modal-header">
                        <button class="close" type="button" data-dismiss="modal">
                            &times;
                        </button>
                        <h4>Session Expired</h4>
                    </div>
                    <div class="modal-body">
                        <h3>Please close this message to login</h3>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-success" data-dismiss="modal">
                            Close
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="alert alert-danger collapse" id="divError">
            <a href="#" class="close" id="linkClose">&times;</a>
            <div id="divErrorText"></div>
        </div>
    </div>
    <script src="Scripts/jquery-3.3.1.min.js"></script>
    <script src="Scripts/bootstrap.min.js"></script>
    <script type="text/javascript">
        $(document).ready(function () {
            if (sessionStorage.getItem('accessToken') == null) {
                window.location.href = 'Login.html';
            }

            $('#spanUsername').text('Hello '+ sessionStorage.getItem('userName'));
            $('#errorModal').on('hidden.bs.modal', function () {
                window.location.href = 'Login.html';
            });

            $('#btnLogoff').click(function () {
                sessionStorage.removeItem('accessToken');
                window.location.href = 'Login.html';
            });

            $('#linkClose').click(function () {
                $('#divError').hide('fade');
            });
            $('#btnLoadEmployees').click(function () {
                $.ajax({
                    url: '/api/employees',
                    method: 'GET',
                    headers: {
                        'Authorization' : 'Bearer ' + sessionStorage.getItem('accessToken')
                    },
                    success: function(data) {
                        $('#divData').removeClass('hidden');
                        $('#tblBody').empty();
                        $.each(data, function (index, value) {
                         var row = $('<tr><td>' + value.id + '</td><td>'
                                + value.firstName + '</td> <td>'
                                + value.lastName + '</td><td>'
                                + value.gender + '</td><td>'
                                + value.salary + '</td></tr>');
                            $('#tblData').append(row);
             });
         },
                    error: function (jqXHR) {
                        if (jqXHR.status == '401') {
                            $('#errorModal').modal('show');
                        } else {
                            $('#divErrorText').text(jqXHR.responseText);
                        $('#divError').show('fade');
                       }
                    }
                });
            });
        });
    </script>
</body>
</html>
